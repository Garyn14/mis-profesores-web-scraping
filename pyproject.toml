[tool.poetry]
name = "mis-profesores-scraping"
version = "1.0.0"
description = "web scraping microservice for MisProfesores.com"
authors = ["garyn.fernando.hr@gmail.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
pydantic = "2.10.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
cachetools = "^5.3.0"
pydantic-settings = "^2.9.1"
colorlog = "^6.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"
httpx = "^0.27.0"
mypy = "^1.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"